name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      LUA_LIB: ${{ github.workspace }}/.lua/lib
      LUA_LIB_NAME: lua55
      LUA_LINK: dylib
      LD_LIBRARY_PATH: ${{ github.workspace }}/.lua/lib
      DYLD_LIBRARY_PATH: ${{ github.workspace }}/.lua/lib
      AGENT_BIN: ${{ github.workspace }}/portable-agents/target/debug/agent${{ runner.os == 'Windows' && '.exe' || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: agent-connector
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          persist-credentials: false
          path: portable-agents
      - uses: luau-project/setup-lua@c47c002fc60841a11b22ef3058c86a3d08acf218
        with:
          lua-version: 5.5.0
          luarocks-version: 3.12.2
      - uses: dtolnay/rust-toolchain@46511b1c83438f0dd37c02d843619ece5a4abb5b
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.3
      - run: cargo build --locked
        working-directory: portable-agents
      - run: deno task check
        working-directory: agent-connector
