name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: agent-connector
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          persist-credentials: false
          path: portable-agents
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.9.3
      - run: deno task check
        working-directory: agent-connector
