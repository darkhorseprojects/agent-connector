name: agent-connector

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  PORTABLE_AGENTS_COMMIT: 70fab4f1ecb98dbfa185054d338e9d0c18ea04ea

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: agent-connector, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          ref: ${{ env.PORTABLE_AGENTS_COMMIT }}
          path: portable-agents
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - name: Verify source
        working-directory: agent-connector
        shell: bash
        run: |
          deno fmt --check
          deno lint
          deno check src/main.ts

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-26.04, id: linux-x86_64 }
          - { os: ubuntu-26.04-arm, id: linux-aarch64 }
          - { os: macos-15-intel, id: macos-x86_64 }
          - { os: macos-15, id: macos-aarch64 }
          - { os: windows-latest, id: windows-x86_64, target: x86_64-windows-gnu }
          - { os: windows-11-arm, id: windows-aarch64, target: aarch64-windows-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: agent-connector, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          ref: ${{ env.PORTABLE_AGENTS_COMMIT }}
          path: portable-agents
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        if: matrix.id != 'windows-aarch64'
        with: { version: 0.16.0 }
      - name: Install x86 Zig on Windows ARM
        if: matrix.id == 'windows-aarch64'
        shell: pwsh
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'zig-x64.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.16.0/zig-x86_64-windows-0.16.0.zip' -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne '68659eb5f1e4eb1437a722f1dd889c5a322c9954607f5edcf337bc3684a75a7e') { throw 'Zig checksum mismatch' }
          Expand-Archive $zip (Join-Path $env:RUNNER_TEMP 'zig-x64')
          Join-Path $env:RUNNER_TEMP 'zig-x64/zig-x86_64-windows-0.16.0' | Out-File -FilePath $env:GITHUB_PATH -Append
      - name: Install Lua on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes liblua5.5-dev pkgconf
      - name: Install Lua on macOS
        if: runner.os == 'macOS'
        run: brew install lua pkgconf
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        if: runner.os == 'Windows'
        with:
          msystem: ${{ matrix.id == 'windows-aarch64' && 'CLANGARM64' || 'UCRT64' }}
          path-type: inherit
          update: true
          pacboy: lua:p pkgconf:p
      - name: Build Portable Agents on Unix
        if: runner.os != 'Windows'
        shell: bash
        working-directory: portable-agents
        run: zig build -Doptimize=ReleaseSafe
      - name: Build Portable Agents on Windows
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: portable-agents
        run: zig build -Doptimize=ReleaseSafe -Dtarget=${{ matrix.target }}
      - name: Compile
        working-directory: agent-connector
        run: deno task compile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: agent-connector-${{ matrix.id }}
          path: agent-connector/dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: agent-connector-*, path: artifacts }
      - name: Archive
        working-directory: artifacts
        run: |
          for directory in agent-connector-*; do
            case "$directory" in
              *-windows-*) zip -qr "$directory.zip" "$directory" ;;
              *) tar -czf "$directory.tar.gz" "$directory" ;;
            esac
          done
          sha256sum agent-connector-*.tar.gz agent-connector-*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          body_path: RELEASE_NOTES.md
