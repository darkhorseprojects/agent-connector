name: agent-connector

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  PORTABLE_AGENTS_COMMIT: 189520ae5c79cec729e03b799138efff604534d7
  PORTABLE_AGENTS_VERSION: v0.1.3

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: agent-connector, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          ref: ${{ env.PORTABLE_AGENTS_COMMIT }}
          path: portable-agents
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - name: Verify source
        working-directory: agent-connector
        shell: bash
        run: |
          deno fmt --check
          deno lint
          deno check src/main.ts

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, id: linux-x86_64 }
          - { os: ubuntu-24.04-arm, id: linux-aarch64 }
          - { os: macos-15-intel, id: macos-x86_64 }
          - { os: macos-15, id: macos-aarch64 }
          - { os: windows-latest, id: windows-x86_64 }
          - { os: windows-11-arm, id: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: agent-connector, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          ref: ${{ env.PORTABLE_AGENTS_COMMIT }}
          path: portable-agents
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - name: Download Portable Agents on Unix
        if: runner.os != 'Windows'
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          directory="$RUNNER_TEMP/portable-agents-release"
          asset="portable-agents-${PORTABLE_AGENTS_VERSION}-${{ matrix.id }}.tar.gz"
          mkdir -p "$directory" portable-agents/zig-out/bin
          gh release download "$PORTABLE_AGENTS_VERSION" --repo darkhorseprojects/portable-agents --pattern "$asset" --pattern SHA256SUMS --dir "$directory"
          if command -v sha256sum >/dev/null; then
            (cd "$directory" && grep -F "  $asset" SHA256SUMS | sha256sum -c -)
          else
            (cd "$directory" && grep -F "  $asset" SHA256SUMS | shasum -a 256 -c -)
          fi
          tar -xOf "$directory/$asset" "${asset%.tar.gz}/agent" > portable-agents/zig-out/bin/agent
          chmod +x portable-agents/zig-out/bin/agent
      - name: Download Portable Agents on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          $directory = Join-Path $env:RUNNER_TEMP 'portable-agents-release'
          $asset = "portable-agents-$env:PORTABLE_AGENTS_VERSION-${{ matrix.id }}.zip"
          New-Item -ItemType Directory -Path $directory
          gh release download $env:PORTABLE_AGENTS_VERSION --repo darkhorseprojects/portable-agents --pattern $asset --pattern SHA256SUMS --dir $directory
          $expected = ((Get-Content (Join-Path $directory 'SHA256SUMS') | Where-Object { $_.EndsWith("  $asset") }) -split '\s+')[0]
          $actual = (Get-FileHash (Join-Path $directory $asset) -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Portable Agents checksum mismatch' }
          Expand-Archive (Join-Path $directory $asset) $directory
          $bin = Join-Path $env:GITHUB_WORKSPACE 'portable-agents/zig-out/bin'
          New-Item -ItemType Directory -Path $bin
          Copy-Item (Get-ChildItem $directory -Filter agent.exe -Recurse | Select-Object -First 1) $bin
      - name: Compile
        working-directory: agent-connector
        run: deno task compile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: agent-connector-${{ matrix.id }}
          path: agent-connector/dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { persist-credentials: false }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: agent-connector-*, path: artifacts }
      - name: Archive
        working-directory: artifacts
        run: |
          for directory in agent-connector-*; do
            case "$directory" in
              *-windows-*) zip -qr "$directory.zip" "$directory" ;;
              *) tar -czf "$directory.tar.gz" "$directory" ;;
            esac
          done
          sha256sum agent-connector-*.tar.gz agent-connector-*.zip > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/SHA256SUMS
          body_path: RELEASE_NOTES.md
