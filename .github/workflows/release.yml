name: agent-connector

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  PORTABLE_AGENTS_VERSION: 1.0.0

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, id: linux-x86_64 }
          - { os: ubuntu-24.04-arm, id: linux-aarch64 }
          - { os: macos-13, id: macos-x86_64 }
          - { os: macos-14, id: macos-aarch64 }
          - { os: windows-latest, id: windows-x86_64 }
          - { os: windows-11-arm, id: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: agent-connector, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          ref: v${{ env.PORTABLE_AGENTS_VERSION }}
          path: portable-agents
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - name: Install matching Portable Agents bundle
        shell: bash
        working-directory: portable-agents
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir "$RUNNER_TEMP/agent"
          gh release download "v$PORTABLE_AGENTS_VERSION" -R darkhorseprojects/portable-agents -p "*-${{ matrix.id }}.*" -D "$RUNNER_TEMP/agent"
          archive=$(find "$RUNNER_TEMP/agent" -type f | head -1)
          if [[ "$archive" == *.zip ]]; then unzip -q "$archive" -d "$RUNNER_TEMP/agent"; else tar -xzf "$archive" -C "$RUNNER_TEMP/agent"; fi
          agent=$(find "$RUNNER_TEMP/agent" -type f \( -name agent -o -name agent.exe \) | head -1)
          bundle=$(dirname "$agent")
          mkdir -p zig-out/bin .lux
          cp "$agent" zig-out/bin/
          cp -R "$bundle/.lux/runtime" .lux/runtime
      - name: Test and compile
        working-directory: agent-connector
        run: deno task check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: agent-connector-${{ matrix.id }}
          path: agent-connector/dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: agent-connector-*, path: artifacts }
      - name: Archive
        working-directory: artifacts
        run: |
          for directory in agent-connector-*; do tar -czf "$directory.tar.gz" "$directory"; done
          sha256sum agent-connector-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with: { files: "artifacts/*", generate_release_notes: true }
