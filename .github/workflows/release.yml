name: agent-connector

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  PORTABLE_AGENTS_COMMIT: 44c502cd0efd16d963270020593ceabed8ad6019

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: agent-connector, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          ref: ${{ env.PORTABLE_AGENTS_COMMIT }}
          path: portable-agents
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - name: Verify source
        working-directory: agent-connector
        shell: bash
        run: |
          deno fmt --check
          deno lint
          deno check src/main.ts

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, id: linux-x86_64 }
          - { os: ubuntu-24.04-arm, id: linux-aarch64 }
          - { os: macos-13, id: macos-x86_64 }
          - { os: macos-14, id: macos-aarch64 }
          - { os: windows-latest, id: windows-x86_64 }
          - { os: windows-11-arm, id: windows-aarch64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { path: agent-connector, persist-credentials: false }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: darkhorseprojects/portable-agents
          ref: ${{ env.PORTABLE_AGENTS_COMMIT }}
          path: portable-agents
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with: { deno-version: v2.9.3 }
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29
        with: { version: 0.16.0 }
      - name: Build Portable Agents and its Lua runtime
        shell: bash
        working-directory: portable-agents
        run: |
          curl -fsSL https://www.lua.org/ftp/lua-5.5.0.tar.gz -o "$RUNNER_TEMP/lua.tar.gz"
          test "$(sha256sum "$RUNNER_TEMP/lua.tar.gz" | cut -d' ' -f1)" = 57ccc32bbbd005cab75bcc52444052535af691789dba2b9016d5c50640d68b3d
          tar -xzf "$RUNNER_TEMP/lua.tar.gz" -C "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/lua55/lib/pkgconfig" "$RUNNER_TEMP/lua55/bin"
          sources=$(find "$RUNNER_TEMP/lua-5.5.0/src" -maxdepth 1 -name '*.c' ! -name lua.c ! -name luac.c ! -name onelua.c ! -name ltests.c -print)
          case "$RUNNER_OS" in
            Linux) zig cc -O2 -fPIC -DLUA_USE_LINUX -shared $sources -lm -ldl -Wl,-soname,liblua.so.5.5 -o "$RUNNER_TEMP/lua55/lib/liblua.so.5.5"; ln -s liblua.so.5.5 "$RUNNER_TEMP/lua55/lib/liblua5.5.so"; library="$RUNNER_TEMP/lua55/lib/liblua.so.5.5" ;;
            macOS) zig cc -O2 -fPIC -DLUA_USE_MACOSX -dynamiclib $sources -Wl,-install_name,@rpath/liblua5.5.dylib -o "$RUNNER_TEMP/lua55/lib/liblua5.5.dylib"; library="$RUNNER_TEMP/lua55/lib/liblua5.5.dylib" ;;
            Windows) zig cc -O2 -DLUA_BUILD_AS_DLL -shared $sources -Wl,--out-implib,"$RUNNER_TEMP/lua55/lib/liblua5.5.dll.a" -o "$RUNNER_TEMP/lua55/bin/lua5.5.dll"; library="$RUNNER_TEMP/lua55/bin/lua5.5.dll" ;;
          esac
          cat > "$RUNNER_TEMP/lua55/lib/pkgconfig/lua5.5.pc" <<EOF
          prefix=$RUNNER_TEMP/lua55
          libdir=\${prefix}/lib
          Name: Lua
          Description: Lua language engine
          Version: 5.5.0
          Libs: -L\${libdir} -llua5.5
          EOF
          export PKG_CONFIG_PATH="$RUNNER_TEMP/lua55/lib/pkgconfig"
          [[ "$RUNNER_OS" != Linux ]] || export LD_LIBRARY_PATH="$RUNNER_TEMP/lua55/lib"
          [[ "$RUNNER_OS" != macOS ]] || export DYLD_LIBRARY_PATH="$RUNNER_TEMP/lua55/lib"
          [[ "$RUNNER_OS" != Windows ]] || export PATH="$RUNNER_TEMP/lua55/bin:$PATH"
          zig build -Doptimize=ReleaseSafe -Dsystem-lua=true --search-prefix "$RUNNER_TEMP/lua55"
          cp "$library" zig-out/bin/
      - name: Compile
        working-directory: agent-connector
        run: deno task compile
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: agent-connector-${{ matrix.id }}
          path: agent-connector/dist
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    environment: release
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with: { pattern: agent-connector-*, path: artifacts }
      - name: Archive
        working-directory: artifacts
        run: |
          for directory in agent-connector-*; do tar -czf "$directory.tar.gz" "$directory"; done
          sha256sum agent-connector-*.tar.gz > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with: { files: "artifacts/*", generate_release_notes: true }
