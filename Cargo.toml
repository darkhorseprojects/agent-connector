[package]
name = "agent-connector"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
description = "Connect Discord messages to Portable Agents"

[[bin]]
name = "agc"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
fs4 = "0.13.1"
hex = "0.4.3"
home = "0.5.12"
humantime = "2.4.0"
parse-size = "1.1.0"
process-wrap = { version = "9.1.0", features = ["tokio1", "std"] }
rand = "0.9.2"
rpassword = "7.4.0"
saphyr-parser = "0.0.11"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml_ng = "0.10.0"
serenity = { version = "0.12.5", default-features = false, features = ["builder", "client", "gateway", "http", "model", "rustls_backend"] }
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5.8"
zeroize = "1.8.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.180"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.25.0"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
